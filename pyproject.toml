[project]
name = "wotl"
version = "0.1.0"
description = "Who Owns the Land? — neighbourhood deprivation and land ownership profiles for the City of Cape Town"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.2.0",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pyogrio>=0.13.0",
    "pyproj>=3.7.2",
    "requests>=2.34.2",
    "shapely>=2.2.0",
]

[project.scripts]
wotl = "wotl.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
