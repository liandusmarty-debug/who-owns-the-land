name: Something is broken
description: The map, a page or the pipeline doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. Samsung A03, Chrome 128
  - type: textarea
    id: extra
    attributes:
      label: Anything else? (screenshots, error messages)
