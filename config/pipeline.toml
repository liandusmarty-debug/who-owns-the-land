# Who Owns the Land? — pipeline configuration.
# Everything tunable lives here so analysts can change it without touching code.

[crs]
storage = "EPSG:4326"   # what we store and publish
metric  = "EPSG:2048"   # Hartebeesthoek94 / Lo19 — metres, for area maths in Cape Town

[privacy]
# SALs with fewer households than this are flagged and excluded from ranking
# (small numbers can make households identifiable and make rates unstable).
min_households = 30
# Columns that must never reach data/processed or outputs (POPIA guard).
forbidden_columns = [
  "owner_name", "owner", "registered_owner", "id_number", "id_no",
  "person_name", "surname", "first_name", "contact", "phone", "email",
]

[index]
normaliser = "zscore"   # "zscore" or "minmax"
quintiles  = 5          # 1 = least deprived … 5 = most deprived

# Each indicator is numerator / denominator, using the canonical census counts built in
# [census.tables] below. Each denominator is the valid total of the indicator's own table
# (excluding "Unspecified" / "Not applicable"). Weights are relative; equal by default.
[index.indicators.informal_dwelling]
label = "Households in informal dwellings"
numerator = "hh_informal"
denominator = "households"
weight = 1.0

[index.indicators.no_piped_water]
label = "Households without piped water in dwelling or yard"
numerator = "hh_no_piped_water"
denominator = "hh_water_total"
weight = 1.0

[index.indicators.no_flush_toilet]
label = "Households without a flush toilet"
numerator = "hh_no_flush_toilet"
denominator = "hh_toilet_total"
weight = 1.0

[index.indicators.no_electric_light]
label = "Households without electricity for lighting"
numerator = "hh_no_electric_light"
denominator = "hh_lighting_total"
weight = 1.0

[index.indicators.low_income]
label = "Households with low or no income (under R38,200 a year in 2011)"
numerator = "hh_low_income"
denominator = "hh_income_total"
weight = 1.0

[index.indicators.unemployment]
label = "Unemployment rate"
numerator = "unemployed"
denominator = "labour_force"
weight = 1.0

[index.indicators.no_matric]
label = "Adults (20+) without matric"
numerator = "adults_no_matric"
denominator = "adults_20plus"
weight = 1.0

# ---------------------------------------------------------------------------
# Census 2011 small-area tables (Stats SA SuperWEB2 exports in data/raw/census_sal/).
# One CSV per table, named <file>.csv. Category labels are matched AFTER normalising:
# lowercase, keep only a-z0-9 ("Piped (tap) water inside yard" -> "pipedtapwaterinsideyard").
# Patterns are regular expressions on that normalised label.
#   total      = name for the sum of valid categories (the indicator denominator)
#   total_all  = name for the sum of every category (used for population)
#   counts.X   = { match = [...] }  sum of matching categories
#              = { not = [...] }    valid total minus matching categories
# VERIFY these labels against the first real export: the pipeline stops with the list of
# available categories if a rule matches nothing.
# ---------------------------------------------------------------------------
[census]
key = "sal_code"
exclude = ["^total$", "unspecified", "notapplicable", "donotknow"]

[census.tables.dwelling_type]
total = "households"
counts.hh_informal = { match = ["informaldwelling", "shack"] }

[census.tables.piped_water]
total = "hh_water_total"
counts.hh_no_piped_water = { not = ["insidedwelling", "insideyard"] }

[census.tables.toilet_facilities]
total = "hh_toilet_total"
counts.hh_no_flush_toilet = { not = ["^flushtoilet"] }

[census.tables.energy_lighting]
total = "hh_lighting_total"
counts.hh_no_electric_light = { not = ["^electricity"] }

[census.tables.household_income]
total = "hh_income_total"
counts.hh_low_income = { match = ["^noincome", "^r1r4800", "^r4801r9600", "^r9601r19600", "^r19601r38200"] }

[census.tables.employment_status]
# export for ALL persons (incl. "Age less than 15 years") so total_all is the population
total_all = "population"
counts.labour_force = { match = ["^employed$", "^unemployed$"] }
counts.unemployed = { match = ["^unemployed$"] }

[census.tables.education_20plus]
# export filtered to persons aged 20+
total = "adults_20plus"
counts.adults_no_matric = { match = ["^noschooling", "^grade0", "^grade[1-9](?![0-9])", "^grade1[01]", "lessthangrade12"] }

[ownership]
# Owner TYPE per parcel, first that applies:
#   1. data/raw/owner_types/*.csv  (sg26_code + owner_type, or a raw owner name that is classified
#      by the rules below and then DROPPED — never stored)
#   2. Surveyor-General public layers  ([ownership.public_layers])
#   3. otherwise `unknown` — land without owner information is never assumed to be private
categories = ["City", "Province", "National", "Private", "Other", "Unknown"]
unknown = "Unknown"
name_default = "Private"   # a raw owner NAME matching no rule is a private person or company

[ownership.public_layers]
sg_public_places = "City"     # public places vest in the municipality
sg_streets = "City"           # public road reserves
sg_state_land = "National"    # unalienated state land

[[ownership.rules]]
pattern = "city of cape town|cape town municipality|municipality"
type = "City"
[[ownership.rules]]
pattern = "western cape|provincial government|province"
type = "Province"
[[ownership.rules]]
pattern = "republic of south africa|national government|transnet|prasa|eskom|sanparks|public works"
type = "National"
[[ownership.rules]]
pattern = "trust|church|community property association|\\bcpa\\b"
type = "Other"

[pilot]
name = "Masiphumelele"

[web]
simplify_tolerance_m = 5.0   # geometry simplification before publishing
coord_precision = 5          # decimal places (~1 m) — keeps the map light

# ---------------------------------------------------------------------------
# Data sources. Every dataset must declare publisher, licence and URL.
# Full research notes and access routes: docs/DATA-SOURCES.md
#
#   kind = "arcgis"  -> paged ArcGIS REST query (where / out_fields / bbox), saved as GeoJSON
#   url  = ""        -> manual: drop the file(s) into data/raw/<id>/ (logged + checksummed)
#
# Licences
#   Stats SA: reuse allowed if Stats SA is acknowledged as the original source, the analysis is
#     presented as independent processing, and reprocessed data is not sold.
#   City of Cape Town: Open Data Policy 27781 (2020) + Terms of Use
#     (https://www.capetown.gov.za/General/Terms-of-use-open-data): free, "as is", no reuse
#     restriction; credit "City of Cape Town Open Data Portal".
#   Surveyor-General: (c) Surveyor General, Cape Town, via Western Cape spatial data warehouse.
# ---------------------------------------------------------------------------

[[sources]]
id = "census_sal"
title = "Census 2011, small-area tables (dwelling, water, toilet, lighting, income, employment, education)"
publisher = "Statistics South Africa"
licence = "Stats SA: use with acknowledgement as original source; not for resale"
url = ""
notes = "Manual export from SuperWEB2 (https://superweb.statssa.gov.za/webapi/), see docs/DATA-SOURCES.md. Census 2022 small-area data is not publicly released."

[[sources]]
id = "sal_boundaries"
title = "Small Areas (Census 2011), City of Cape Town"
publisher = "Statistics South Africa, via Western Cape Government spatial data warehouse"
licence = "Stats SA: use with acknowledgement as original source; not for resale"
kind = "arcgis"
url = "https://gis.westerncape.gov.za/server2/rest/services/SpatialDataWarehouse/StatsSA_CensusBoundaries/MapServer/2"
where = "MN_MDB_C = 'CPT'"
out_fields = "SAL_CODE,SP_CODE,SP_NAME,MP_CODE,MP_NAME"

[[sources]]
id = "wards"
title = "Municipal wards (2026 demarcation, 118 wards)"
publisher = "City of Cape Town / Municipal Demarcation Board"
licence = "City of Cape Town Open Data Policy 27781 + Terms of Use"
kind = "arcgis"
url = "https://citymaps.capetown.gov.za/agsext/rest/services/Theme_Based/Political_Administrative_Boundaries/MapServer/7"
out_fields = "WARD_NAME,WARD_YEAR"

[[sources]]
id = "suburbs"
title = "Official suburbs"
publisher = "City of Cape Town"
licence = "City of Cape Town Open Data Policy 27781 + Terms of Use"
kind = "arcgis"
url = "https://citymaps.capetown.gov.za/agsext/rest/services/Theme_Based/Political_Administrative_Boundaries/MapServer/4"
out_fields = "OFC_SBRB_NAME"

[[sources]]
id = "informal_settlements"
title = "Informal settlement boundaries"
publisher = "City of Cape Town"
licence = "n/a"
url = ""
notes = "NOT openly available: the Western Cape CoCT_InformalSettlements layer now requires a token. Census 2011 sub-place names are used instead."

[[sources]]
id = "parcels"
title = "Land parcels (cadastre, legal status, zoning)"
publisher = "City of Cape Town Open Data Portal"
licence = "City of Cape Town Open Data Policy 27781 + Terms of Use"
kind = "arcgis"
url = "https://services6.arcgis.com/nyYfO9SxHU2ChQd9/arcgis/rest/services/Property/FeatureServer/0"
# street address fields deliberately excluded (POPIA)
out_fields = "SG26_CODE,PRTY_NMBR,OFC_SBRB_NAME,WARD_NAME,LU_LGL_STS_DSCR,ZONING"
notes = "852,214 parcels; no owner field."

[[sources]]
